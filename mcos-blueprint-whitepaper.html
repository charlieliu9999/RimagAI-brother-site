    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-card: #161618;
      --bg-card-hover: #1c1c1f;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --green: #22c55e;
      --radius: 12px;
      --radius-lg: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);

      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;

    a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent-hover); }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10, 10, 11, 0.8);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    nav .container {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #fff; }
    .nav-brand .logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #a855f7);

    .nav-links { display: flex; gap: 8px; }
    .nav-links a { padding: 8px 16px; border-radius: 8px; font-size: 14px; color: var(--text-secondary); }
    .nav-links a:hover { color: var(--text-primary); background: var(--bg-card); }

    /* ── Layout (Sidebar + Content) ── */

      display: flex;
      max-width: 1400px;
      margin: 80px auto 40px;
      padding: 0 24px;
      gap: 40px;
      align-items: flex-start;

      max-height: calc(100vh - 120px);

      padding-right: 16px;

    aside.toc-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    aside.toc-sidebar::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .toc-title {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 16px; padding-left: 12px;

    #toc-list li { margin-bottom: 8px; }
    #toc-list a {
      display: block; font-size: 14px; color: var(--text-secondary);

    .content-inner li { margin-bottom: 8px; }

      border-left: 4px solid var(--accent);
      background: var(--bg-card); padding: 16px 20px;
      margin: 24px 0; border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-secondary);

    .content-inner blockquote p:last-child { margin-bottom: 0; }

    .content-inner pre { background: var(--bg-card) !important; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; margin: 24px 0; }
    .content-inner code { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 13.5px; }
    .content-inner p > code, .content-inner li > code { background: var(--bg-card); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; color: var(--accent-hover); }

    /* Tables */
    .content-inner table { width: 100%; border-collapse: collapse; margin: 30px 0; font-size: 14px; overflow:hidden; border-radius: var(--radius); border-style: hidden; box-shadow: 0 0 0 1px var(--border); }
    .content-inner thead { background: var(--bg-card); }
    .content-inner th, .content-inner td { padding: 14px 20px; text-align: left; border-bottom: 1px solid var(--border); }
    .content-inner th { color: #fff; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px; }
    .content-inner td { color: var(--text-secondary); }
    .content-inner tr:last-child td { border-bottom: none; }
    .content-inner tbody tr:hover { background: rgba(255,255,255,0.02); }

    // 4. Render the Markdown
    const targetDiv = document.getElementById('md-render-target');
    const loaderDiv = document.getElementById('loader');
    
    targetDiv.innerHTML = marked.parse(rawMarkdown);
    
    // 5. Setup the TOC
    const tocList = document.getElementById('toc-list');
    const headings = targetDiv.querySelectorAll('h2, h3');
    headings.forEach((heading, idx) => {
      // Assign an ID if not exists
      if(!heading.id) {
        // Basic slugify
        heading.id = heading.textContent.trim().toLowerCase().replace(/[\s\W-]+/g, '-') || ('heading-' + idx);
      }

      // Create list item
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + heading.id;
      a.textContent = heading.textContent;
      // Add indent class based on tag
      a.className = heading.tagName.toLowerCase() === 'h2' ? 'toc-h2' : 'toc-h3';
      
      li.appendChild(a);
      tocList.appendChild(li);
    });

    // ScrollSpy for TOC
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting) {
          const id = entry.target.getAttribute('id');
          document.querySelectorAll('#toc-list a').forEach(link => link.classList.remove('active'));
          const targetLink = document.querySelector(`#toc-list a[href="#${id}"]`);
          if(targetLink) targetLink.classList.add('active');
        }
      });
    }, { rootMargin: '-10% 0px -80% 0px' });

    headings.forEach(heading => observer.observe(heading));

    // 6. Reveal & Run Mermaid
    loaderDiv.style.display = 'none';
    targetDiv.style.display = 'block';

    // Await for the DOM update to ensure mermaid tags exist
    setTimeout(() => {
      // Transform language-mermaid blocks to mermaid divs
      document.querySelectorAll('pre code.language-mermaid').forEach((code) => {
        const pre = code.parentElement;
        const wrapper = document.createElement('div');
        wrapper.className = 'mermaid-wrapper';
        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = code.textContent;
        wrapper.appendChild(mermaidDiv);
        pre.parentElement.replaceChild(wrapper, pre);
      });

      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        securityLevel: 'loose'
      });

      mermaid.init(undefined, document.querySelectorAll('.mermaid'));
    }, 50);

  </script>
</body>
