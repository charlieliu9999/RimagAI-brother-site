<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PPT 媒体资源预览</title>
<style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        h1 { text-align: center; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .card img, .card video { max-width: 100%; max-height: 200px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #475569; }
        .card .title { font-weight: bold; margin-bottom: 6px; word-break: break-all; text-align: center; }
        .card .size { font-size: 12px; color: #94a3b8; }
    </style>
</head>
