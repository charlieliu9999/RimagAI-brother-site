<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" role="img" aria-labelledby="title desc">
  <title id="title">RimagAi Brother 产品工作流总览</title>
  <desc id="desc">展示从医生输入、AI 工作台处理到医疗场景输出的整体产品流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111113"/>
      <stop offset="0.55" stop-color="#121827"/>
      <stop offset="1" stop-color="#08141a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#f8fafc}
      .muted{fill:#a1a1aa}
      .small{font-size:20px}
      .body{font-size:24px;font-weight:650}
      .title{font-size:34px;font-weight:800;letter-spacing:-.03em}
      .tag{font-size:18px;font-weight:700}
      .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;fill:#67e8f9}
    </style>
  </defs>
  <rect width="1180" height="540" rx="34" fill="url(#bg)"/>
  <path d="M70 74 C235 0 393 80 520 52 C712 10 816 10 1024 88" fill="none" stroke="#6366f1" stroke-opacity=".18" stroke-width="2"/>
  <path d="M90 460 C260 360 418 486 580 424 C778 348 910 438 1090 360" fill="none" stroke="#06b6d4" stroke-opacity=".18" stroke-width="2"/>
  <text x="70" y="72" class="label title">从临床输入到智能输出</text>
  <text x="70" y="106" class="label muted small">一个桌面工作台承接多模态输入、场景化 Agent、规则质控和院内工具调用</text>

  <g filter="url(#shadow)">
    <rect x="70" y="158" width="270" height="250" rx="26" fill="#161618" stroke="#27272a"/>
    <text x="102" y="205" class="label body">医生侧输入</text>
    <text x="102" y="238" class="label muted small">语音 / 文本 / 截图 / DICOM</text>
    <g transform="translate(102 276)">
      <rect width="68" height="68" rx="18" fill="#222237" stroke="#37375f"/>
      <text x="34" y="45" text-anchor="middle" class="label tag">EMR</text>
      <rect x="84" width="68" height="68" rx="18" fill="#1c2a2f" stroke="#27505d"/>
      <text x="118" y="45" text-anchor="middle" class="label tag">影像</text>
      <rect x="168" width="68" height="68" rx="18" fill="#2a2118" stroke="#5b3d1c"/>
      <text x="202" y="45" text-anchor="middle" class="label tag">报告</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="128" width="270" height="310" rx="30" fill="#101827" stroke="#334155"/>
    <rect x="488" y="166" width="204" height="54" rx="17" fill="url(#cyan)"/>
    <text x="590" y="202" text-anchor="middle" fill="#050816" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="850">RimagAi Brother</text>
    <text x="590" y="256" text-anchor="middle" class="label body">医疗 AI 工作台</text>
    <text x="590" y="290" text-anchor="middle" class="label muted small">Scene + Agent + Tool + Rule</text>
    <g transform="translate(493 326)">
      <rect width="86" height="44" rx="14" fill="#181f38" stroke="#4f46e5"/>
      <text x="43" y="29" text-anchor="middle" class="mono">Agent</text>
      <rect x="98" width="86" height="44" rx="14" fill="#132d35" stroke="#0891b2"/>
      <text x="141" y="29" text-anchor="middle" class="mono">MCP</text>
      <rect x="49" y="58" width="86" height="44" rx="14" fill="#183021" stroke="#16a34a"/>
      <text x="92" y="87" text-anchor="middle" class="mono">Rule</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="158" width="270" height="250" rx="26" fill="#161618" stroke="#27272a"/>
    <text x="872" y="205" class="label body">医疗场景输出</text>
    <text x="872" y="238" class="label muted small">结构化结果、建议、报告与佐证</text>
    <g transform="translate(872 276)">
      <rect width="210" height="36" rx="12" fill="#1d2432" stroke="#334155"/>
      <text x="18" y="24" class="label small">病历生成 / 质控</text>
      <rect y="48" width="210" height="36" rx="12" fill="#1d2432" stroke="#334155"/>
      <text x="18" y="72" class="label small">CDSS / Cost-DRG</text>
      <rect y="96" width="210" height="36" rx="12" fill="#1d2432" stroke="#334155"/>
      <text x="18" y="120" class="label small">报告生成 / 影像分析</text>
    </g>
  </g>

  <path d="M352 286 H430" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round"/>
  <path d="M420 270 L444 286 L420 302 Z" fill="#06b6d4"/>
  <path d="M738 286 H816" stroke="url(#green)" stroke-width="5" stroke-linecap="round"/>
  <path d="M806 270 L830 286 L806 302 Z" fill="#14b8a6"/>

  <text x="388" y="258" text-anchor="middle" class="label muted small">场景识别</text>
  <text x="776" y="258" text-anchor="middle" class="label muted small">工具执行</text>
</svg>
